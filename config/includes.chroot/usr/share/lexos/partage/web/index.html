<!DOCTYPE html>
<!--
  =============================================================================
   LexOS — la page « Partager »
  =============================================================================
   CE QU'ELLE REMPLACE. Jusqu'ici, « lexos share qr » ouvrait une fenêtre yad :
   un dialogue GTK générique, le QR en image et le texte en balises Pango. Alex,
   photo de l'ISO 72 : « la page pour partager, elle est pas pareille ». Elle ne
   pouvait pas l'être — yad ne sait pas prendre le thème LexOS.

   MÊME PATRON QUE LES AUTRES PANNEAUX. Paramètres, Volet, Cartes et IA sont
   tous des pages web locales affichées dans une fenêtre Qt. Celle-ci aussi :
   c'est le seul moyen SÛR que l'apparence reste la même partout, plutôt que de
   recopier le dessin à la main d'un panneau à l'autre.

   ORDRE DE CHARGEMENT. ui.css AVANT style.css : les jetons communs d'abord, ce
   qui est propre à ce panneau ensuite. Aucune couleur en dur ici — la règle du
   dépôt, et un contrôle de CI la vérifie.
  =============================================================================
-->
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partager — LexOS</title>
<script>
/*  LE MODE (sombre / clair) ARRIVE PAR L'ADRESSE. Même mécanique que les
    Paramètres, le Volet et l'IA : le lanceur Python lit ~/.config/lexos/mode
    — écrit par lexos-theme-gen depuis toujours — et l'ajoute en ?mode=…
    L'attribut est posé AVANT le premier rendu, donc pas d'éclair blanc au
    démarrage. Sans paramètre, on reste en sombre, qui est le défaut.
    SANS CE BLOC, « lexos theme clair » repeindrait le bureau en crème et
    laisserait CE panneau noir, en négatif du reste — le défaut trouvé après
    l'ISO 71, et qu'un contrôle de CI garde depuis. */
try{var m=new URLSearchParams(location.search).get("mode");
    if(m==="clair")document.documentElement.dataset.mode="clair";}catch(e){}
</script>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <!--
    ═══ CE QUE CETTE FENÊTRE A PERDU, ET POURQUOI ═══
    ALEX, DEUX PHOTOS : « la fenêtre en montre trop ». Elle affichait, autour
    du QR, un paragraphe sur le Wi-Fi, une légende sous le code, un bloc
    « Ça marche dans les deux sens », et deux rangées « KDE Connect » et
    « Bluetooth ». Six explications pour un geste qui en demande zéro : on
    scanne, ou on tape l'adresse.

    Ce qui reste est ce qui SERT : le code, l'adresse, ce que la machine sait
    de l'état du partage, et de quoi refermer. Les appareils proches n'ont pas
    disparu — ils sont passés derrière leur bouton, ce qui évite en prime
    d'appeler kdeconnect-cli et bluetoothctl (quatre secondes chacun) à chaque
    ouverture de la fenêtre.
  -->
  <header class="tete">
    <h1>Partager</h1>
  </header>

  <!--  LE QR EST SUR DU BLANC, ET C'EST LE SEUL RECTANGLE BLANC DE LexOS.
        Un QR inversé — modules clairs sur fond sombre — est refusé par une
        bonne partie des appareils photo. La marge blanche autour fait partie
        du code, pas de la décoration : qrencode la dessine (-m 2) et la
        rogner casserait la lecture. -->
  <section class="haut">
    <div class="cadre-qr">
      <img id="qr" alt="Code QR de l'adresse de partage">
    </div>

    <!--  L'ADRESSE, EN BLANC ET CLIQUABLE. Elle est le repli du QR — un
          téléphone dont l'appareil photo ne lit pas les codes, un ordinateur
          portable — et le seul texte de la fenêtre qu'on ait à recopier. Un
          clic la met dans le presse-papiers. -->
    <button class="adresse" id="url" title="Cliquer pour copier">…</button>

    <!--  ═══ LA LIGNE D'ÉTAT — L'OUTIL SE TESTE LUI-MÊME ═══
          Trois états, jamais un quatrième : Prêt · Pare-feu à ouvrir ·
          Le téléphone doit être sur le même Wi-Fi. C'est la réponse à
          « on n'est pas capable de partager réellement » : la fenêtre dit
          maintenant CE QU'ELLE A VÉRIFIÉ, au lieu de laisser chercher. -->
    <p class="etat" id="etat"><span class="pastille" id="pastille"></span><span id="etat-texte">Vérification…</span></p>
    <p class="etat-detail" id="etat-detail"></p>

    <!--  ═══ L'ÉCRITURE DE CE BOUTON EST BLANCHE, ET SEULEMENT ICI ═══
          Partout ailleurs dans LexOS, un bouton orange plein porte du NOIR.
          Alex a demandé du blanc pour cet écran-là. On applique sa demande
          sans la propager : la règle vit dans le style.css de CE panneau, pas
          dans ui.css, qui est partagé. Ne pas « uniformiser » au passage. -->
    <button class="btn orange" id="appareils">Scanner un appareil proche</button>
    <div class="autres" id="autres"></div>

    <div class="bloc">
      <p class="etiquette">Ce que tu partages</p>
      <div id="fichiers"></div>
    </div>
  </section>

  <footer class="pied">
    <span class="minuterie"><span class="temoin" id="temoin"></span>
      Se ferme tout seul dans <b id="reste">--:--</b></span>
    <button class="btn gris" id="ouvrir">Ouvrir le dossier des reçus</button>
    <button class="btn gris" id="fermer">Fermer le partage</button>
  </footer>

</main>

<script src="app.js"></script>
</body>
</html>
